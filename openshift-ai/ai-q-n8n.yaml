apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  labels:
    service: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      service: n8n
  template:
    metadata:
      labels:
        service: n8n
    spec:
      serviceAccountName: default  # 确保已绑定 anyuid SCC
      containers:
        - name: n8n
          image: n8nio/n8n:latest
          ports:
            - containerPort: 5678
          env:
            - name: N8N_EDITOR_BASE_URL
              value: https://n8n-n8n.apps.obs-hub-of-hubs-aws-418-sno-hfnmm.scale.red-chesterfield.com
            - name: WEBHOOK_URL
              value: https://n8n-n8n.apps.obs-hub-of-hubs-aws-418-sno-hfnmm.scale.red-chesterfield.com
            - name: N8N_PROTOCOL
              value: http
            - name: N8N_PORT
              value: "5678"
            - name: N8N_USER_FOLDER
              value: "/home/node/.n8n"
            - name: HOME
              value: "/home/node"
          ports:
            - containerPort: 5678
          resources:
            requests:
              memory: "250Mi"
            limits:
              memory: "500Mi"
          volumeMounts:
            - mountPath: /home/node/.n8n
              name: n8n-claim0
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
      volumes:
        - name: n8n-claim0
          persistentVolumeClaim:
            claimName: n8n-claim0
        - name: n8n-secret
          secret:
            secretName: n8n-secret
          
